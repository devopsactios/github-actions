name: context-demo
on: [push]

jobs:
  github-context:
    runs-on: ubuntu-latest
    steps:
      - name: print info
        run:  |
          echo "${{ toJson(github) }}"
          echo "branch name: ${{ github.ref_name }}"
          echo "branch name: ${{ github.actor }}"
      - name: print runner status info
        run: echo "${{ toJson(job)}}"
        
      - name: print job status
        run: echo "${{ toJson(runner)}}"
